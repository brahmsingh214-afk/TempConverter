name: CI/CD Pipeline - Temperature Converter

# SOURCE trigger: every push to main starts the pipeline.
# workflow_dispatch adds a "Run workflow" button in the Actions tab.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ---------------- STAGE 1: SOURCE ----------------
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Get the latest code from GitHub
        uses: actions/checkout@v4

      - name: Show which commit triggered the pipeline
        run: git log -1

      - name: Check the project has all required files
        run: |
          for f in pom.xml site/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f"
              exit 1
            fi
          done
          if [ ! -d src/main/java ]; then
            echo "::error::Missing src/main/java (your program code)"
            exit 1
          fi
          if [ ! -d src/test/java ]; then
            echo "::error::Missing src/test/java (your JUnit tests)"
            exit 1
          fi
          echo "All required files found."

  # ---------------- STAGE 2: BUILD ----------------
  build:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and package the program (no tests yet)
        run: mvn -B package -DskipTests

      - name: Save the JAR as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ---------------- STAGE 3: TEST ----------------
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run the JUnit tests
        run: mvn -B test

      - name: Save the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  # ---------------- STAGE 4: DEPLOY ----------------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the JAR from the build stage
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: _site/download

      - name: Get the test reports from the test stage
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports

      - name: Make the website folder
        run: |
          cp -r site/* _site/
          {
            echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Test results</title></head><body>"
            echo "<h1>Latest test results</h1>"
            echo "<p>Commit: ${GITHUB_SHA}</p>"
            echo "<p>Built on: $(date -u)</p>"
            echo "<pre>"
            cat reports/*.txt
            echo "</pre>"
            echo "<p><a href='index.html'>Back to home</a></p>"
            echo "</body></html>"
          } > _site/test-results.html

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
